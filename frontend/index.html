<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header>
        <h1>🚀 TaskFlow</h1>
        <p>AI Assisted Task Management Platform</p>
    </header>


    <!-- =========================
         Dashboard Statistics
    ========================== -->

    <section class="stats-section">

        <div class="stat-card total">
            <h3>📋 Total Tasks</h3>
            <h1 id="totalTasks">0</h1>
        </div>

        <div class="stat-card pending">
            <h3>⏳ Pending</h3>
            <h1 id="pendingTasks">0</h1>
        </div>

        <div class="stat-card completed">
            <h3>✅ Completed</h3>
            <h1 id="completedTasks">0</h1>
        </div>

    </section>


    <!-- =========================
         Main Layout
    ========================== -->

    <main>


        <!-- =========================
             Left Side - Add Task
        ========================== -->

        <section class="form-section">

            <!-- AI Quick Add -->

            <h2>🤖 AI Quick Add</h2>

            <textarea
                id="quickDescription"
                placeholder="Example: Finish frontend tomorrow high priority"
            ></textarea>

            <input
                type="number"
                id="quickProjectId"
                placeholder="Project ID"
            >

            <button
                type="button"
                id="quickAddBtn"
            >
                🤖 Create using AI
            </button>


            <hr>


            <!-- Normal Add Task -->

            <h2>Add New Task</h2>

            <form id="taskForm">

                <label for="title">
                    Task Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter Task Title"
                >

                <small id="titleError"></small>


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter Description"
                ></textarea>


                <label for="priority">
                    Priority
                </label>

                <select id="priority">

                    <option value="low">
                        Low
                    </option>

                    <option value="medium" selected>
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>


                <label for="due_date">
                    Due Date
                </label>

                <input
                    type="text"
                    id="due_date"
                    placeholder="Today / Tomorrow / Next Friday"
                >


                <label for="project_id">
                    Project ID
                </label>

                <input
                    type="number"
                    id="project_id"
                    placeholder="Project ID"
                >


                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- =========================
             Right Side - Task List
        ========================== -->

        <section class="task-section">

            <h2>Task List</h2>


            <!-- Normal Search -->

            <input
                type="text"
                id="searchTask"
                placeholder="🔍 Search tasks..."
            >


            <!-- Algorithm Search -->

            <div class="algorithm-search">

                <input
                    type="text"
                    id="algorithmSearch"
                    placeholder="🔎 Search exact task title..."
                >

                <select id="searchAlgorithm">

                    <option value="binary">
                        Binary Search
                    </option>

                    <option value="linear">
                        Linear Search
                    </option>

                </select>


                <button
                    type="button"
                    id="algorithmSearchBtn"
                >
                    🔍 Search
                </button>


                <button
                    type="button"
                    id="clearSearchBtn"
                >
                    ❌ Clear
                </button>

            </div>


            <!-- Sort -->

            <select id="sortTasks">

                <option value="newest">
                    🆕 Newest First
                </option>

                <option value="oldest">
                    📜 Oldest First
                </option>

                <option value="priority">
                    🔥 High Priority
                </option>

                <option value="status">
                    📌 Pending First
                </option>

            </select>


            <!-- Task List -->

            <div id="taskList"></div>

        </section>

    </main>


    <!-- =========================
         Delete Confirmation Modal
    ========================== -->

    <div
        id="deleteModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>🗑️ Delete Task</h2>

            <p>
                Are you sure you want to delete this task?
            </p>

            <div class="modal-buttons">

                <button
                    id="cancelDelete"
                    class="cancel-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="confirmDelete"
                    class="confirm-btn"
                    type="button"
                >
                    Delete
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         Success Toast
    ========================== -->

    <div
        id="successToast"
        class="toast"
    >
    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
