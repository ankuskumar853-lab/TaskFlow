<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->
    <header class="top-header">

    <div class="taskflow-brand">

        <div class="brand-icon">
            🚀
        </div>

        <div class="brand-text">
            <h1>TaskFlow</h1>
            <span>AI-Assisted Task Management</span>
        </div>

    </div>

    <div class="header-actions">

        <button
        type="button"
        id="logoutBtn"
        class="logout-btn"

    >
        🚪 Logout
    </button>

    </div>

</header>

    

    <!-- ==========================================
         DASHBOARD STATISTICS
    =========================================== -->

    <section class="stats-section">

        <div class="stat-card total">

            <h3>📋 Total Tasks</h3>

            <h1 id="totalTasks">0</h1>

        </div>


        <div class="stat-card pending">

            <h3>⏳ Pending</h3>

            <h1 id="pendingTasks">0</h1>

        </div>


        <div class="stat-card completed">

            <h3>✅ Completed</h3>

            <h1 id="completedTasks">0</h1>

        </div>

    </section>


    <!-- ==========================================
         MAIN LAYOUT
    =========================================== -->

    <main>


        <!-- ======================================
             LEFT SIDE
        ======================================= -->

        <section class="form-section">


            <!-- ==================================
                 AI QUICK ADD
            =================================== -->

            <div class="ai-quick-box">

                <h2>🤖 AI Quick Add</h2>


                <textarea
                    id="quickDescription"
                    placeholder="Example: Finish frontend tomorrow high priority"
                ></textarea>


                <input
                    type="number"
                    id="quickProjectId"
                    placeholder="Project ID"
                >


                <button
                    type="button"
                    id="quickAddBtn"
                >
                    🤖 Create using AI
                </button>

            </div>


            <!-- ==================================
                 NORMAL ADD TASK
            =================================== -->

            <div class="normal-task-box">

                <h2>Add New Task</h2>


                <form id="taskForm">


                    <label for="title">
                        Task Title
                    </label>


                    <input
                        type="text"
                        id="title"
                        placeholder="Enter Task Title"
                    >


                    <small id="titleError"></small>


                    <label for="description">
                        Description
                    </label>


                    <textarea
                        id="description"
                        placeholder="Enter Description"
                    ></textarea>


                    <label for="priority">
                        Priority
                    </label>


                    <select id="priority">

                        <option value="low">
                            Low
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                    </select>


                    <label for="due_date">
                        Due Date
                    </label>


                    <input
                        type="text"
                        id="due_date"
                        placeholder="Today / Tomorrow / Next Friday"
                    >


                    <label for="project_id">
                        Project ID
                    </label>


                    <input
                        type="number"
                        id="project_id"
                        placeholder="Project ID"
                    >


                    <button type="submit">
                        Add Task
                    </button>

                </form>

            </div>

        </section>


        <!-- ======================================
             RIGHT SIDE - TASK LIST
        ======================================= -->

        <section class="task-section">

            <h2>📋 Task List</h2>


            <!-- NORMAL SEARCH -->

            <input
                type="text"
                id="searchTask"
                placeholder="🔍 Search tasks..."
            >


            <!-- ==================================
                 ALGORITHM SEARCH
            =================================== -->

            <div class="algorithm-search">

                <input
                    type="text"
                    id="algorithmSearch"
                    placeholder="🔎 Search exact task title..."
                >


                <select id="searchAlgorithm">

                    <option value="binary">
                        Binary Search
                    </option>

                    <option value="linear">
                        Linear Search
                    </option>

                </select>


                <button
                    type="button"
                    id="algorithmSearchBtn"
                >
                    🔍 Search
                </button>


                <button
                    type="button"
                    id="clearSearchBtn"
                >
                    ❌ Clear
                </button>

            </div>


            <!-- ==================================
                 SORT
            =================================== -->

            <select id="sortTasks">

                <option value="newest">
                    🆕 Newest First
                </option>

                <option value="oldest">
                    📜 Oldest First
                </option>

                <option value="priority">
                    🔥 High Priority
                </option>

                <option value="status">
                    📌 Pending First
                </option>

            </select>


            <!-- ==================================
                 TASK LIST
            =================================== -->

            <div id="taskList"></div>

        </section>

    </main>


    <!-- ==========================================
         DELETE CONFIRMATION MODAL
    =========================================== -->

    <div
        id="deleteModal"
        class="modal"
    >

        <div class="modal-content">

            <h2>🗑️ Delete Task</h2>

            <p>
                Are you sure you want to delete this task?
            </p>


            <div class="modal-buttons">

                <button
                    id="cancelDelete"
                    class="cancel-btn"
                    type="button"
                >
                    Cancel
                </button>


                <button
                    id="confirmDelete"
                    class="confirm-btn"
                    type="button"
                >
                    Delete
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         AI QUICK ADD PREVIEW MODAL
    =========================================== -->

    <div
        id="quickTaskPreview"
        class="modal"
    >

        <div class="modal-content ai-preview-content">

            <h2>🤖 AI Task Preview</h2>


            <!-- Description -->

            <div class="ai-preview-row">

                <strong>Description</strong>

                <p id="quickPreviewDescription">
                    -
                </p>

            </div>


            <!-- Priority -->

            <div class="ai-preview-row">

                <strong>Priority</strong>


                <div class="priority-options">

                    <button
                        type="button"
                        class="priority-option"
                        data-priority="low"
                    >
                        🟢 Low
                    </button>


                    <button
                        type="button"
                        class="priority-option active"
                        data-priority="medium"
                    >
                        🟡 Medium
                    </button>


                    <button
                        type="button"
                        class="priority-option"
                        data-priority="high"
                    >
                        🔴 High
                    </button>

                </div>

            </div>


            <!-- Due Date -->

            <div class="ai-preview-row">

                <label for="quickTaskDueDate">
                    <strong>Due Date</strong>
                </label>


                <input
                    type="text"
                    id="quickTaskDueDate"
                    placeholder="Today / Tomorrow / Next Friday"
                >

            </div>


            <!-- Buttons -->

            <div class="modal-buttons">

                <button
                    type="button"
                    id="cancelQuickTaskBtn"
                    class="cancel-btn"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    id="confirmQuickTaskBtn"
                    class="confirm-btn ai-confirm-btn"
                >
                    🤖 Add AI Task
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         SUCCESS TOAST
    =========================================== -->

    <div
        id="successToast"
        class="toast"
    ></div>


    <!-- ==========================================
         AUTHENTICATION CHECK
    =========================================== -->

    <script>

        const taskflowToken =
            localStorage.getItem("taskflow_token");

        if (!taskflowToken) {

            window.location.href = "login.html";

        }

    </script>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="script.js"></script>
    <script src="logout.js"></script>


</body>

</html>
